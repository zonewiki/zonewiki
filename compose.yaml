# Zone: build the image from this checkout and run it.
#
# ./run.sh up drives this file: it fills in what compose can't work out
# itself (the build string from git, the port's bind address from
# LEAF_ALLOW_REMOTE, the host's timezone, the wiki path with ~ expanded) and
# refuses a wiki folder that doesn't exist. Used directly, it works too:
#
#   docker compose up -d --build        (or: podman compose up -d --build)
#
# Settings come from .env (see README); used directly, also set
# LEAF_BIND=0.0.0.0 there for LAN access, and LEAF_DATA as an absolute path.
name: leaf

services:
  leaf:
    build:
      context: .
      dockerfile: Containerfile
      args:
        # "<hash> <commit date>" shown next to the version; run.sh sets it.
        LEAF_BUILD: ${LEAF_BUILD:-unknown}
        # Semantic search: the model and what runs it are baked into the image.
        LEAF_SEMANTIC_SEARCH: ${LEAF_SEMANTIC_SEARCH:-}
    image: leaf
    container_name: leaf
    # Not root: Zone runs as the host user, so the files it writes in the wiki
    # are theirs. run.sh sets your id -u/-g (with rootless podman plus
    # compose.podman.yaml's keep-id, which maps them in unchanged). Used
    # directly, set LEAF_UID/LEAF_GID in .env if yours aren't 1000.
    user: "${LEAF_UID:-1000}:${LEAF_GID:-1000}"
    # A minimal init as PID 1 reaps orphaned processes (Zone as PID 1
    # wouldn't, and they would pile up as zombies until the PID limit).
    init: true
    restart: unless-stopped
    # Every setting, secrets included. Docker compose hands them over through
    # its API; podman-compose as podman -e arguments (briefly visible in ps).
    env_file: .env
    environment:
      LEAF_DATA: /wiki-data
      # The wiki's folder on the host, for the MCP tools' file: lines.
      LEAF_HOST_DATA: ${LEAF_DATA:-~/leaf}
      # The user's timezone, so "today" is their day; run.sh sets the host's.
      TZ: ${TZ:-UTC}
    ports:
      # Localhost only unless LEAF_ALLOW_REMOTE (run.sh sets LEAF_BIND=0.0.0.0).
      - "${LEAF_BIND:-127.0.0.1}:5000:5000"
    volumes:
      - type: bind
        source: ${LEAF_DATA:-~/leaf}
        target: /wiki-data
        bind:
          # A mistyped path must not start an empty wiki somewhere else.
          create_host_path: false
          # Relabel for SELinux (ignored where SELinux is off).
          selinux: Z
    # Reported as unhealthy when Zone stops answering (compose ps); restarting
    # then is podman's --health-on-failure or an autoheal container's job.
    healthcheck:
      test: ["CMD", "/app/leaf", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      # Docker's default, and podman's name for its k8s-file driver: `logs -f`
      # works with both (podman's journald default doesn't follow everywhere).
      driver: json-file
