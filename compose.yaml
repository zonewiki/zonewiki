# Zone from the prebuilt image on ghcr.io (amd64 and arm64), instead of
# building it: no checkout, git or build tools needed, on your own computer,
# a server or a NAS. Put this file, run.sh and a .env with ZONE_DATA=<your
# wiki folder> next to each other, then:
#
#   ./run.sh up            (./run.sh update for a new image; ./run.sh --help)
#
# run.sh fills in what compose can't: your user ID, the timezone, ~ in
# ZONE_DATA, ZONE_ALLOW_REMOTE=1 as the port's address, and rootless podman's
# compose.podman.yaml (put it beside this file too). In a checkout of Zone,
# run.sh builds the image instead (compose.build.yaml).
#
# Without run.sh (a Synology's Container Manager finds this file by its
# name), .env needs at least (see .env.example and "With the prebuilt image"
# in docs/spec/deployment.md):
#
#   ZONE_DATA=/home/anna/zonewiki        # absolute; the folder must exist
#   ZONE_UID=1000                        # the owner of that folder (id -u)
#   ZONE_GID=1000                        # its group (id -g)
#   TZ=Europe/Vienna
#
# and then: docker compose up -d (update: docker compose pull, then up -d).
#
# Zone is then at http://localhost:5080, on this machine only. For other
# devices (a NAS, a server), open the port to the network in .env:
#
#   ZONE_BIND=0.0.0.0                    # or, with run.sh, ZONE_ALLOW_REMOTE=1
#   ZONE_PORT=5081                       # another port than 5080
#
# and tell Zone the names it is opened by, in its settings file
# (.zone/config): ./run.sh config set hosts nas.local, or without run.sh
#
#   docker compose run --rm zonewiki /app/zonewiki config set hosts nas.local
#
# Open to the network, Zone asks in the browser for a password before it
# shows anything (or set the login here: ./run.sh user add alice).
name: zonewiki

services:
  zonewiki:
    image: ghcr.io/zonewiki/zonewiki:latest
    container_name: zonewiki
    # Not root: Zone writes the wiki as the folder's owner. No defaults: a
    # wrong guess would show up later as files Zone can't write.
    user: "${ZONE_UID:?set ZONE_UID in .env (id -u of the wiki folder's owner)}:${ZONE_GID:?set ZONE_GID in .env (id -g)}"
    # A minimal init as PID 1 reaps orphaned processes.
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      ZONE_DATA: /wiki-data
      # Where the port below is published: beyond localhost, a wiki without
      # a login asks for a password in the browser first (First run, README).
      ZONE_BIND: ${ZONE_BIND:-127.0.0.1}
      # The wiki's folder on the host, for the MCP tools' file: lines.
      ZONE_HOST_DATA: ${ZONE_DATA}
      TZ: ${TZ:-UTC}
    ports:
      # Localhost only unless ZONE_BIND=0.0.0.0; ZONE_PORT for another port
      # on the host (default 5080: not 5000, which a Synology's DSM and a Mac's AirPlay Receiver have).
      - "${ZONE_BIND:-127.0.0.1}:${ZONE_PORT:-5080}:5080"
    volumes:
      - type: bind
        source: ${ZONE_DATA:?set ZONE_DATA in .env (the wiki folder, absolute path)}
        target: /wiki-data
        bind:
          # A mistyped path must not start an empty wiki somewhere else.
          create_host_path: false
    healthcheck:
      test: ["CMD", "/app/zonewiki", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        # Zone runs for months: keep the log from growing without bound.
        max-size: "10m"
        max-file: "3"
