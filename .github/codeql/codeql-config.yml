# What CodeQL scans (.github/workflows/codeql.yml): Zonewiki, not its tests,
# whose test doubles (a proxy that copies headers, an assertion on rendered
# HTML) read as flaws and ship nowhere.
# Zonewiki's own checks are told to CodeQL in extensions/zone-go/models.yml,
# which CodeQL finds there by itself.
name: Zonewiki
paths-ignore:
  - tests
