# Tests and a secret scan on every push and pull request; on main (and v*
# tags) the image is then built for amd64 and arm64 and pushed to GitHub's
# container registry as ghcr.io/<owner>/zonewiki, which compose.yaml
# pulls. On a v* tag the release binaries are attached to its GitHub release.
#
# The same checks as .forgejo/workflows/ci.yml, on GitHub's runners (not
# the bench: Forgejo runs it, The bench in docs/spec/testing.md). No
# secrets to set up: the image and release jobs use the workflow's GITHUB_TOKEN.
# A new package on ghcr.io starts private; make it public once (the package's
# settings on GitHub) so a NAS can pull it without logging in.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ghcr.io wants the name in lower case; the owner may not be.
  IMAGE: ghcr.io/${{ github.repository_owner }}/zonewiki

jobs:
  checks:
    # Through run.sh, as on your machine, in the image Containerfile.tools
    # builds: test (gofmt, go vet, go test, the API tests), e2e (browser and
    # tasks-core tests) and leaks (gitleaks over the whole history).
    # The runners have podman, which run.sh prefers.
    strategy:
      fail-fast: false
      matrix:
        check: [test, e2e, leaks]
    name: ${{ matrix.check }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # leaks scans every commit; the others need only the last. Strings,
          # as a number 0 is falsy and `&& 0 || 1` would always give 1.
          fetch-depth: ${{ matrix.check == 'leaks' && '0' || '1' }}
      - name: ./run.sh ${{ matrix.check }}
        run: ./run.sh ${{ matrix.check }}

  retrieval:
    # Search's quality against its floor (./run.sh retrieval; Measuring
    # retrieval in docs/spec/search.md): the sample wiki's questions, by
    # keywords and by meaning, in the app's image with the model.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: ./run.sh retrieval
        run: ./run.sh retrieval

  image:
    # One image per architecture, each on a runner of its own (no
    # emulation), pushed by digest only; `manifest` joins them under the tags.
    needs: [checks]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build string
        id: meta
        # Same format as run.sh's.
        run: |
          echo "build=$(git log -1 --format='%h %cd' --date=format:'%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          # Semantic search's model is in the image; ZONE_SEMANTIC_SEARCH=on
          # in .env turns it on, as with ./run.sh.
          build-args: |
            ZONE_BUILD=${{ steps.meta.outputs.build }}
            ZONE_SEMANTIC_SEARCH=on
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Zonewiki: wiki, notes and tasks for you, your team, and your AI agents (plain Markdown files, self-hosted)
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    # Both architectures under one name: latest (main), the short commit
    # hash, and the version on a v* tag (v1.2.0 -> 1.2.0 and 1.2).
    needs: [image]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$image@sha256:%s " *)
      - name: Show it
        run: docker buildx imagetools inspect "$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]'):${{ steps.tags.outputs.version }}"

  release:
    # On a v* tag, once the checks pass: the binaries for Linux and macOS,
    # amd64 and arm64 (./run.sh binaries, in the tools image with its pinned
    # Go, without cgo, with Go's simd experiment), with SHA256SUMS, LICENSE and THIRD_PARTY_LICENSES,
    # attached to the tag's GitHub release, made here when it has none yet,
    # with the annotated tag's message as its notes (Release binaries in
    # docs/spec/deployment.md). With gh, which the
    # runners have, and the workflow's token.
    needs: [checks]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: ./run.sh binaries
        run: ./run.sh binaries
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "Zonewiki ${TAG#v}" --notes-from-tag
          gh release upload "$TAG" dist/* --clobber
