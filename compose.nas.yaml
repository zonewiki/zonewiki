# Leaf on a NAS or server: runs the prebuilt image from ghcr.io (amd64 and
# arm64) instead of building it, so no checkout, git or build tools are
# needed on the machine. Put this file and a .env next to each other (a
# Synology Container Manager project, or any folder), then:
#
#   docker compose -f compose.nas.yaml up -d        (update: pull, then up -d)
#
# .env needs at least (see .env.example and "On a NAS or server" in
# docs/spec/deployment.md):
#
#   LEAF_DATA=/volume1/docker/leaf/wiki   # absolute; the folder must exist
#   LEAF_UID=1026                         # the owner of that folder (id -u)
#   LEAF_GID=100                          # its group (id -g; Synology: users)
#
# The wiki's own settings go in its settings file (.leaf/config), through the
# container; first of all the names you open Leaf by (or LEAF_ALLOW_REMOTE=1
# in .env), then a login:
#
#   docker compose -f compose.nas.yaml run --rm leaf /app/leaf config set hosts nas.local
#   docker compose -f compose.nas.yaml run --rm leaf /app/leaf user add alice
#   TZ=Europe/Vienna
name: leaf

services:
  leaf:
    image: ghcr.io/gklingler/leaf:latest
    container_name: leaf
    # Not root: Leaf writes the wiki as the folder's owner. No defaults: a
    # wrong guess would show up later as files Leaf can't write.
    user: "${LEAF_UID:?set LEAF_UID in .env (id -u of the wiki folder's owner)}:${LEAF_GID:?set LEAF_GID in .env (id -g)}"
    # A minimal init as PID 1 reaps orphaned processes.
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      LEAF_DATA: /wiki-data
      # The wiki's folder on the host, for the MCP tools' file: lines.
      LEAF_HOST_DATA: ${LEAF_DATA}
      TZ: ${TZ:-UTC}
    ports:
      # On the LAN. Not 5000 on the host: Synology's DSM uses it.
      - "${LEAF_PORT:-5080}:5000"
    volumes:
      - type: bind
        source: ${LEAF_DATA:?set LEAF_DATA in .env (the wiki folder, absolute path)}
        target: /wiki-data
        bind:
          # A mistyped path must not start an empty wiki somewhere else.
          create_host_path: false
    healthcheck:
      test: ["CMD", "/app/leaf", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        # A NAS runs for months: keep the log from growing without bound.
        max-size: "10m"
        max-file: "3"
