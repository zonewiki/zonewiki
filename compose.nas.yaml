# Zone on a NAS or server: runs the prebuilt image from ghcr.io (amd64 and
# arm64) instead of building it, so no checkout, git or build tools are
# needed on the machine. Put this file and a .env next to each other (a
# Synology Container Manager project, or any folder), then:
#
#   docker compose -f compose.nas.yaml up -d        (update: pull, then up -d)
#
# .env needs at least (see .env.example and "On a NAS or server" in
# docs/spec/deployment.md):
#
#   ZONE_DATA=/volume1/docker/zonewiki/wiki # absolute; the folder must exist
#   ZONE_UID=1026                         # the owner of that folder (id -u)
#   ZONE_GID=100                          # its group (id -g; Synology: users)
#
# The wiki's own settings go in its settings file (.zone/config), through the
# container; first of all the names you open Zone by (or ZONE_ALLOW_REMOTE=1
# in .env, to open it by its IP address with nothing set):
#
#   docker compose -f compose.nas.yaml run --rm zonewiki /app/zonewiki config set hosts nas.local
#
# Then open Zone in a browser: it asks for a password before it shows
# anything (or set the login here: … /app/zonewiki user add alice).
#   TZ=Europe/Vienna
name: zonewiki

services:
  zonewiki:
    image: ghcr.io/zonewiki/zonewiki:latest
    container_name: zonewiki
    # Not root: Zone writes the wiki as the folder's owner. No defaults: a
    # wrong guess would show up later as files Zone can't write.
    user: "${ZONE_UID:?set ZONE_UID in .env (id -u of the wiki folder's owner)}:${ZONE_GID:?set ZONE_GID in .env (id -g)}"
    # A minimal init as PID 1 reaps orphaned processes.
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      ZONE_DATA: /wiki-data
      # The port below is open to the LAN: a wiki without a login asks for a
      # password in the browser first (First run, README).
      ZONE_BIND: 0.0.0.0
      # The wiki's folder on the host, for the MCP tools' file: lines.
      ZONE_HOST_DATA: ${ZONE_DATA}
      TZ: ${TZ:-UTC}
    ports:
      # On the LAN. Not 5000 on the host: Synology's DSM uses it.
      - "${ZONE_PORT:-5080}:5000"
    volumes:
      - type: bind
        source: ${ZONE_DATA:?set ZONE_DATA in .env (the wiki folder, absolute path)}
        target: /wiki-data
        bind:
          # A mistyped path must not start an empty wiki somewhere else.
          create_host_path: false
    healthcheck:
      test: ["CMD", "/app/zonewiki", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        # A NAS runs for months: keep the log from growing without bound.
        max-size: "10m"
        max-file: "3"
