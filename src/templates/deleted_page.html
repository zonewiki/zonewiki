{#- A page that was deleted: when, and a button to bring it back. -#}
{% extends "layout.html" %}
{% block body %}
{{ breadcrumb_html|safe }}
<header class="page-header"><h1>{{ title }}</h1></header>
<article class="page-content">
<p>This page was deleted on {{ date }}.</p>
<form method="post" action="{{ url('restore', slug) }}/{{ sha }}">
  <button type="submit" class="btn">Restore page</button>
</form>
</article>
{% endblock %}
