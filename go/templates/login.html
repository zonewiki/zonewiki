{{- /* The login gate (LEAF_PASSWORD, or LEAF_USERS: a user name too). */ -}}
{{define "body"}}
<div class="login-wrap">
  <form class="login-form" method="post" action="/login{{with .next_url}}?next={{.}}{{end}}">
    <h2>Sign in to {{.app_name}}{{if .allow_remote}}<span class="remote-badge" title="Remote access enabled">🌐</span>{{end}}</h2>
    {{- if .users}}
    <input type="text" name="username" placeholder="User name" value="{{.username}}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username"{{if not .username}} autofocus{{end}}>
    {{- end}}
    <input type="password" name="password" placeholder="Password"{{if or (not .users) .username}} autofocus{{end}} autocomplete="current-password">
    {{- with .error}}
    <p class="login-error">{{.}}</p>
    {{- end}}
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</div>
{{end}}
