{{- /* /new: a new page's name, without JavaScript (pages are made from links to them). */ -}}
{{define "body"}}
<h1>New Page</h1>
<form class="new-page-form" method="post" action="/new">
  <label for="page-name">Page name</label>
  <input type="text" id="page-name" name="slug"
         placeholder="e.g. My New Page" autofocus required>
  {{- if and .Shell.User .Groups}}
  {{- /* In a group: who the page is for is where it is kept. */}}
  <label for="page-for">For</label>
  <select id="page-for" name="for">
    <option value="">Everyone who uses this wiki</option>
    {{- range .Groups}}
    <option value="group:{{.}}">@{{.}}: in groups/{{.}}/, its members see it</option>
    {{- end}}
    <option value="private">Only you: in private/{{.Shell.User}}/</option>
  </select>
  {{- else}}
  {{- with .Shell.User}}
  <label class="promote-check"><input type="checkbox" name="private" value="1"> Private: in private/{{.}}/, only you see it</label>
  {{- end}}
  {{- end}}
  <button type="submit" class="btn btn-primary">Create</button>
</form>
{{end}}
