# Tests and a secret scan on every push and pull request; on main (and v*
# tags) the image is then built and pushed to this Forgejo's container registry.
#
# Needs a runner with the `docker` label whose job containers get the
# docker socket (`container.docker_host: automount`); the host's engine must
# trust the registry's certificate (e.g. via /etc/docker/certs.d). Repo settings:
#   variable REGISTRY        registry host, e.g. git.example.org (Forgejo's
#                            public address); without it no image is built
#   secret   REGISTRY_TOKEN  access token with package write scope
#   variable REGISTRY_USER   (optional) its owner, default: the repo owner
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The checks run through run.sh, as on your machine, in images built from
    # the repo's Containerfiles: test in the app image, e2e (browser and
    # deck-core tests) and leaks (gitleaks over the whole history) in the
    # tools image. So CI keeps no package lists or commands of its own. Like
    # the image job, the builds run on the host's engine through the socket,
    # so layers come from its cache unless the dependencies changed.
    # LEAF_COPY_REPO: the checkout lives in this job container, not on the
    # host, so run.sh copies it into the container instead of mounting it.
    strategy:
      fail-fast: false
      matrix:
        check: [test, e2e, leaks]
    name: ${{ matrix.check }}
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Install system packages
        # Alpine: nodejs runs actions/checkout, bash run.sh, git its build string.
        run: apk add --no-cache nodejs git bash
      - uses: actions/checkout@v4
        with:
          # leaks scans every commit; the others need only the last. Strings,
          # as a number 0 is falsy and `&& 0 || 1` would always give 1.
          fetch-depth: ${{ matrix.check == 'leaks' && '0' || '1' }}
      - name: ./run.sh ${{ matrix.check }}
        env:
          LEAF_COPY_REPO: 1
        run: ./run.sh ${{ matrix.check }}

  image:
    needs: [checks]
    # Only with a registry to push to (forks and clones without one just test).
    if: github.event_name != 'pull_request' && vars.REGISTRY != ''
    runs-on: docker
    container:
      # The official docker CLI image; the build runs on the host's engine
      # through the mounted socket, so its layer cache survives between runs.
      image: docker:cli
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system packages
        # Alpine: nodejs runs actions/checkout, bash the steps below.
        shell: sh
        run: apk add --no-cache nodejs git bash
      - uses: actions/checkout@v4
      - name: Image name and tags
        id: meta
        env:
          # Forgejo's public address: the host's engine logs in and pushes,
          # and GITHUB_SERVER_URL is the runner's internal one (http://web:3000).
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          registry="$REGISTRY"
          image="$registry/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          sha=$(git rev-parse --short HEAD)
          tags="$image:$sha"
          case "$GITHUB_REF" in
            refs/heads/main) tags="$tags $image:latest" ;;
            refs/tags/v*)    tags="$tags $image:${GITHUB_REF_NAME#v}" ;;
          esac
          # Same format as run.sh and config.py's _source_build().
          build=$(git log -1 --format='%h %cd' --date=format:'%Y-%m-%d %H:%M')
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER || github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "${{ steps.meta.outputs.registry }}" -u "$REGISTRY_USER" --password-stdin
      - name: Build
        run: |
          tag_args=()
          for t in ${{ steps.meta.outputs.tags }}; do tag_args+=(-t "$t"); done
          # docker, unlike podman, doesn't fall back to Containerfile.
          docker build -f Containerfile \
            --build-arg "LEAF_BUILD=${{ steps.meta.outputs.build }}" \
            --build-arg LEAF_SEMANTIC_SEARCH=on \
            "${tag_args[@]}" .
      - name: Push
        run: |
          for t in ${{ steps.meta.outputs.tags }}; do docker push "$t"; done
