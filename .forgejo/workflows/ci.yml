# Tests and a secret scan on every push and pull request; on main (and v*
# tags) the image is then built and pushed to this Forgejo's container registry.
#
# Needs a runner with the `docker` label whose job containers get the
# docker socket (`container.docker_host: automount`); the host's engine must
# trust the registry's certificate (e.g. via /etc/docker/certs.d). Repo settings:
#   variable REGISTRY        registry host, e.g. git.example.org (Forgejo's
#                            public address); without it no image is built
#   secret   REGISTRY_TOKEN  access token with package write scope
#   variable REGISTRY_USER   (optional) its owner, default: the repo owner
# To publish main and the v* tags to another repository (GitHub) after the checks:
#   variable PUBLISH_REPO    owner/name there; without it nothing is published
#   secret   PUBLISH_KEY     a private ssh key that may push there (a deploy key
#                            with write access); without it nothing is published
#   secret   PUBLISH_CHECK   (optional) a shell script that refuses a push by failing
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run at a time, whatever its branch or tag, none cancelled: the jobs run
# their tests on the runner host's engine, and two runs at once (main and a
# tag pushed together) took three times as long, which failed the browser
# tests where they wait and the bench at its budgets. Forgejo runs the runs
# of a group in the order they came (cancel-in-progress: false queues them
# all; the group is the repository's, not a ref's). A cancelled run's tests
# go on in their containers: the next run removes them (in_image in run.sh).
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  checks:
    # The checks run through run.sh, as on your machine, in the image
    # Containerfile.tools builds: test (gofmt, go vet, go test, the API tests), e2e
    # (browser and tasks-core tests) and leaks (gitleaks over the whole
    # history). So CI keeps no package lists or commands of its own. Like
    # the image job, the builds run on the host's engine through the socket,
    # so layers come from its cache unless the dependencies changed.
    # ZONE_COPY_REPO: the checkout lives in this job container, not on the
    # host, so run.sh copies it into the container instead of mounting it.
    # Not for a pull request from another repository (a fork): the job
    # containers get the host engine's socket, which is root on the host,
    # so its code could take over the runner, the layer cache the image is
    # built from and the registry token of the next image job. bench and
    # retrieval need the checks, so they are skipped with them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        check: [test, e2e, leaks]
    name: ${{ matrix.check }}
    runs-on: docker
    container:
      image: docker:29.9.3-cli@sha256:2357639ad1ea7d0194134bf3292622fd4e562483966ed674e5d7c945b5f3b28d
    steps:
      - name: Install system packages
        # Alpine: nodejs runs actions/checkout, bash run.sh, git its build string.
        run: apk add --no-cache nodejs git bash
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # leaks scans every commit; the others need only the last. Strings,
          # as a number 0 is falsy and `&& 0 || 1` would always give 1.
          fetch-depth: ${{ matrix.check == 'leaks' && '0' || '1' }}
      - name: ./run.sh ${{ matrix.check }}
        env:
          ZONE_COPY_REPO: 1
        run: ./run.sh ${{ matrix.check }}

  bench:
    # The tasks at a team's size against their budgets, then under the race
    # detector (./run.sh bench; The bench in docs/spec/testing.md). A job of
    # its own, which the image doesn't wait for. Three times the time
    # budgets: a runner is slower and noisier than the machine they were set on.
    # After the checks: the jobs share the host's engine, and beside test's
    # worker per CPU and e2e's browsers the bench's clients at once measured
    # the CPU they waited for (a page beside 30 searches 7 times slower than
    # alone, where the slack allows 3).
    needs: [checks]
    runs-on: docker
    container:
      image: docker:29.9.3-cli@sha256:2357639ad1ea7d0194134bf3292622fd4e562483966ed674e5d7c945b5f3b28d
    steps:
      - name: Install system packages
        run: apk add --no-cache nodejs git bash
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: ./run.sh bench
        env:
          ZONE_COPY_REPO: 1
          ZONE_BENCH_SLACK: 3
        run: ./run.sh bench

  retrieval:
    # Search's quality against its floor (./run.sh retrieval; Measuring
    # retrieval in docs/spec/search.md): the sample wiki's questions, by
    # keywords and by meaning, in the app's image with the model. A job of
    # its own after the checks, as the bench: it builds that image (from the
    # host's cache, unless the code or the model changed).
    needs: [checks]
    runs-on: docker
    container:
      image: docker:29.9.3-cli@sha256:2357639ad1ea7d0194134bf3292622fd4e562483966ed674e5d7c945b5f3b28d
    steps:
      - name: Install system packages
        run: apk add --no-cache nodejs git bash
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: ./run.sh retrieval
        env:
          ZONE_COPY_REPO: 1
        run: ./run.sh retrieval

  image:
    needs: [checks]
    # Only with a registry to push to (forks and clones without one just test).
    if: github.event_name != 'pull_request' && vars.REGISTRY != ''
    runs-on: docker
    container:
      # The official docker CLI image; the build runs on the host's engine
      # through the mounted socket, so its layer cache survives between runs.
      image: docker:29.9.3-cli@sha256:2357639ad1ea7d0194134bf3292622fd4e562483966ed674e5d7c945b5f3b28d
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system packages
        # Alpine: nodejs runs actions/checkout, bash the steps below.
        shell: sh
        run: apk add --no-cache nodejs git bash
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Image name and tags
        id: meta
        env:
          # Forgejo's public address: the host's engine logs in and pushes,
          # and GITHUB_SERVER_URL is the runner's internal one (http://web:3000).
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          registry="$REGISTRY"
          image="$registry/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          sha=$(git rev-parse --short HEAD)
          tags="$image:$sha"
          case "$GITHUB_REF" in
            refs/heads/main) tags="$tags $image:latest" ;;
            refs/tags/v*)    tags="$tags $image:${GITHUB_REF_NAME#v}" ;;
          esac
          # Same format as run.sh's.
          build=$(git log -1 --format='%h %cd' --date=format:'%Y-%m-%d %H:%M')
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER || github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "${{ steps.meta.outputs.registry }}" -u "$REGISTRY_USER" --password-stdin
      - name: Build
        run: |
          tag_args=()
          for t in ${{ steps.meta.outputs.tags }}; do tag_args+=(-t "$t"); done
          # docker, unlike podman, doesn't fall back to Containerfile.
          # Semantic search's model is in the image; ZONE_SEMANTIC_SEARCH=on
          # in .env turns it on, as with ./run.sh.
          docker build -f Containerfile \
            --build-arg "ZONE_BUILD=${{ steps.meta.outputs.build }}" \
            --build-arg ZONE_SEMANTIC_SEARCH=on \
            "${tag_args[@]}" .
      - name: Push
        run: |
          for t in ${{ steps.meta.outputs.tags }}; do docker push "$t"; done

  github:
    # Publishes what this Forgejo has to a repository elsewhere (GitHub), once
    # the checks pass: main's commit, or the tag, pushed as it is, never
    # forced, so its commits keep their hashes there (Publishing to GitHub in
    # docs/spec/deployment.md). Only a push to this repository runs it, so no
    # stranger's code sees the key.
    needs: [checks]
    if: github.event_name == 'push' && vars.PUBLISH_REPO != ''
    runs-on: docker
    container:
      image: docker:29.9.3-cli@sha256:2357639ad1ea7d0194134bf3292622fd4e562483966ed674e5d7c945b5f3b28d
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system packages
        # Alpine: nodejs runs actions/checkout, bash the step below, openssh the push.
        shell: sh
        run: apk add --no-cache nodejs git bash openssh-client
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Push to the other repository
        env:
          PUBLISH_REPO: ${{ vars.PUBLISH_REPO }}
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          PUBLISH_CHECK: ${{ secrets.PUBLISH_CHECK }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLISH_KEY" ]; then
            echo "PUBLISH_KEY is not set: nothing is published."
            exit 0
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$PUBLISH_KEY" > ~/.ssh/publish_key
          # GitHub's host key, by the fingerprint it publishes for it
          # (docs.github.com, "GitHub's SSH key fingerprints"): a changed one stops the job.
          ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts 2>/dev/null
          fp=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          if [ "$fp" != "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU" ]; then
            echo "GitHub's host key is not the published one ($fp): nothing is pushed." >&2
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/publish_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes"
          git remote add publish "git@github.com:$PUBLISH_REPO.git"
          # The commits there already (an empty repository has no main yet).
          base=""
          if [ -n "$(git ls-remote publish refs/heads/main)" ]; then
            git fetch -q publish '+refs/heads/main:refs/remotes/publish/main'
            base=$(git rev-parse refs/remotes/publish/main)
          fi
          sha=$(git rev-parse HEAD)
          # main only moves forward there; a tag may name a commit it has already.
          if [ -n "$base" ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if git merge-base --is-ancestor "$sha" "$base"; then
              echo "The other repository has $sha already."
              exit 0
            fi
            if ! git merge-base --is-ancestor "$base" "$sha"; then
              echo "The other repository's main ($base) is not an ancestor of $sha: not forcing it." >&2
              exit 1
            fi
          fi
          # An optional check of one's own, kept in a secret: it gets BASE
          # (what the other repository has, maybe empty) and HEAD (what is
          # pushed) and refuses the push by failing.
          if [ -n "$PUBLISH_CHECK" ]; then
            printf '%s\n' "$PUBLISH_CHECK" > "$HOME/publish-check.sh"
            BASE="$base" HEAD="$sha" sh "$HOME/publish-check.sh"
          fi
          case "$GITHUB_REF" in
            refs/heads/main) git push publish "$sha:refs/heads/main" ;;
            refs/tags/v*)    git push publish "$GITHUB_REF" ;;
          esac
          rm -f ~/.ssh/publish_key "$HOME/publish-check.sh"
